name: DSOM Audit & Zero Link Decay CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dsom-audit:
    name: OKF Frontmatter & Link Integrity Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: |
          uv pip install --system pytest pyyaml ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run OKF Frontmatter & Zero Link Decay Tests
        run: |
          pytest tests/test_okf_and_links.py -v
