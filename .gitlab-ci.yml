# GitLab CI/CD Pipeline
# Combines Security Scanning (SAST, Secret Detection) and GitLab Pages deployment
stages:
  - test
  - secret-detection
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

pages:
  image: ruby:3.2
  stage: deploy
  pages: true
  script:
    - gem install jekyll bundler
    - jekyll build -b "/${CI_PROJECT_NAME}" -d public
    - rm -rf public/tools public/AGENTS.html public/CLAUDE.html
  artifacts:
    paths:
      - public
  only:
    - main
