[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bda-lakehouse-docs"
version = "0.1.0"
description = "DSOM Big Data Analytics Lakehouse Documentation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.1",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = ["D100", "D104"]
